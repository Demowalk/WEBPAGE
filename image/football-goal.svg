<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 550" width="280" height="550">
  <defs>
    <!-- Goal Net Pattern -->
    <pattern id="goalNet" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2"/>
    </pattern>

    <!-- Post Shading -->
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Pitch Grass Accent Behind Goal -->
  <rect x="0" y="470" width="280" height="80" fill="rgba(22, 101, 52, 0.2)"/>
  <line x1="20" y1="495" x2="260" y2="495" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Goal Net Depth Box -->
  <polygon points="35,160 245,160 260,200 20,200" fill="rgba(255, 255, 255, 0.08)"/>
  <polygon points="20,200 260,200 270,495 10,495" fill="url(#goalNet)"/>
  
  <!-- Back Support Bars -->
  <line x1="35" y1="160" x2="10" y2="495" stroke="#94a3b8" stroke-width="4"/>
  <line x1="245" y1="160" x2="270" y2="495" stroke="#94a3b8" stroke-width="4"/>
  <line x1="35" y1="160" x2="245" y2="160" stroke="#94a3b8" stroke-width="4"/>

  <!-- Front Goal Posts and Crossbar -->
  <!-- Left Post -->
  <rect x="18" y="195" width="14" height="300" rx="4" fill="url(#postGrad)" stroke="#475569" stroke-width="1"/>
  <!-- Right Post -->
  <rect x="248" y="195" width="14" height="300" rx="4" fill="url(#postGrad)" stroke="#475569" stroke-width="1"/>
  <!-- Crossbar -->
  <rect x="16" y="190" width="248" height="15" rx="4" fill="url(#crossbarGrad)" stroke="#475569" stroke-width="1"/>

  <!-- Corner Joint Brackets with Bayern Red Accents -->
  <circle cx="25" cy="197" r="7" fill="#dc052d"/>
  <circle cx="255" cy="197" r="7" fill="#dc052d"/>

  <!-- Target Top Corner Rings (Soccer Training Targets) -->
  <circle cx="55" cy="235" r="24" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8 4"/>
  <circle cx="225" cy="235" r="24" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8 4"/>
</svg>
