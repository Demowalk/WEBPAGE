<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="6" flood-color="#071b2e" flood-opacity="0.45"/>
    </filter>
    
    <!-- 3D Extrusion Gradient -->
    <linearGradient id="extrudeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Face Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Highlight Specular Gradient -->
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)" transform="translate(40, 40)">
    <!-- 3D Extrusions (Layered bottom-to-top) -->
    <text x="0" y="270" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="#450a0a" letter-spacing="12">MANAV</text>
    <text x="0" y="260" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="#7f1d1d" letter-spacing="12">MANAV</text>
    <text x="0" y="250" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="#991b1b" letter-spacing="12">MANAV</text>
    <text x="0" y="240" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="#b91c1c" letter-spacing="12">MANAV</text>
    <text x="0" y="230" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="#c2410c" letter-spacing="12">MANAV</text>
    <text x="0" y="220" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="#ea580c" letter-spacing="12">MANAV</text>

    <!-- Outer Thick White Outline -->
    <text x="0" y="210" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" letter-spacing="12">MANAV</text>

    <!-- Main Front Face with Gradient -->
    <text x="0" y="210" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="url(#faceGrad)" stroke="#c2410c" stroke-width="4" stroke-linejoin="round" letter-spacing="12">MANAV</text>

    <!-- Inner Highlights -->
    <text x="0" y="202" font-family="'Arial Black', 'Impact', sans-serif" font-size="200" font-weight="900" fill="url(#specGrad)" letter-spacing="12" opacity="0.6">MANAV</text>
  </g>
</svg>
