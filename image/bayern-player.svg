<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <!-- Bayern Munich Red Jersey Gradient -->
    <linearGradient id="bayernRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef1536"/>
      <stop offset="60%" stop-color="#dc052d"/>
      <stop offset="100%" stop-color="#b90426"/>
    </linearGradient>

    <!-- Bavarian Blue Gradient for Crest -->
    <linearGradient id="bavarianBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066b2"/>
      <stop offset="100%" stop-color="#004b87"/>
    </linearGradient>

    <!-- Skin Tone -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Hair -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1f0a02"/>
    </linearGradient>

    <!-- Reusable Bayern Crest Symbol -->
    <g id="bayernCrest">
      <circle cx="0" cy="0" r="10" fill="#dc052d" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#0066b2" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
      <!-- Bavarian diamonds -->
      <polygon points="0,-3 2,-1 0,1 -2,-1" fill="#0066b2"/>
      <polygon points="2,0 4,2 2,4 0,2" fill="#0066b2"/>
      <polygon points="-2,0 0,2 -2,4 -4,2" fill="#0066b2"/>
    </g>
  </defs>

  <!-- ==============================================================
       FRAME 0 (0 to 300): Running / Dribbling Forward
       ============================================================== -->
  <g id="frame-0" transform="translate(150, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="115" rx="42" ry="10" fill="rgba(0, 0, 0, 0.25)"/>

    <!-- Left Leg (back) -->
    <path d="M -12 40 L -28 75 L -35 110" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="-42" y="108" width="18" height="10" rx="3" fill="#1e293b"/> <!-- Boot -->

    <!-- Right Leg (forward step) -->
    <path d="M 10 40 L 26 72 L 20 110" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="14" y="108" width="22" height="10" rx="3" fill="#1e293b"/> <!-- Boot -->

    <!-- Shorts -->
    <rect x="-24" y="25" width="48" height="30" rx="6" fill="#ffffff" stroke="#dc052d" stroke-width="2"/>
    <line x1="-24" y1="40" x2="-24" y2="52" stroke="#dc052d" stroke-width="3"/>
    <line x1="24" y1="40" x2="24" y2="52" stroke="#dc052d" stroke-width="3"/>

    <!-- Torso / Bayern Munich Jersey -->
    <rect x="-26" y="-35" width="52" height="65" rx="10" fill="url(#bayernRed)" stroke="#991b1b" stroke-width="1.5"/>
    <!-- White V-Collar -->
    <polygon points="-12,-35 0,-20 12,-35" fill="#ffffff"/>
    <line x1="-26" y1="-35" x2="-26" y2="25" stroke="#ffffff" stroke-width="3"/>
    <line x1="26" y1="-35" x2="26" y2="25" stroke="#ffffff" stroke-width="3"/>
    <!-- Sponsor T / White Accent -->
    <path d="M -8 -8 L 8 -8 M 0 -8 L 0 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bayern Crest -->
    <use href="#bayernCrest" x="-14" y="-18"/>

    <!-- Left Arm (swinging back) -->
    <path d="M -26 -25 L -48 -2 L -38 18" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -26 -25 L -36 -10" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>

    <!-- Right Arm (swinging forward) -->
    <path d="M 26 -25 L 42 -8 L 48 8" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 26 -25 L 36 -12" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <circle cx="0" cy="-60" r="28" fill="url(#skin)"/>
    <path d="M -28 -66 C -28 -95 28 -95 28 -66 C 18 -66 12 -74 -4 -74 C -18 -74 -22 -66 -28 -66 Z" fill="url(#hairGrad)"/>
    <!-- Eyes & Smile -->
    <ellipse cx="8" cy="-58" rx="4" ry="5" fill="#0f172a"/>
    <path d="M 4 -46 Q 10 -40 16 -46" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- White Headband / Bayern Motif -->
    <path d="M -26 -68 C -10 -76 10 -76 26 -68" fill="none" stroke="#ffffff" stroke-width="4.5"/>
  </g>

  <!-- ==============================================================
       FRAME 1 (300 to 600): Plant Foot & Strike Wind-Up
       ============================================================== -->
  <g id="frame-1" transform="translate(450, 140)">
    <!-- Shadow -->
    <ellipse cx="-10" cy="115" rx="38" ry="10" fill="rgba(0, 0, 0, 0.25)"/>

    <!-- Planted Left Leg (firm on ground) -->
    <path d="M -10 40 L -12 75 L -14 110" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="-24" y="108" width="24" height="10" rx="3" fill="#1e293b"/> <!-- Boot -->

    <!-- Right Leg (cocked back ready to shoot!) -->
    <path d="M 12 38 L -24 65 L -48 78" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="-60" y="74" width="22" height="10" rx="3" fill="#1e293b" transform="rotate(25 -50 78)"/> <!-- Boot cocked back -->

    <!-- Shorts -->
    <rect x="-24" y="25" width="48" height="30" rx="6" fill="#ffffff" stroke="#dc052d" stroke-width="2"/>
    <line x1="-24" y1="40" x2="-24" y2="52" stroke="#dc052d" stroke-width="3"/>
    <line x1="24" y1="40" x2="24" y2="52" stroke="#dc052d" stroke-width="3"/>

    <!-- Torso (tilted forward with intent) -->
    <rect x="-26" y="-35" width="52" height="65" rx="10" fill="url(#bayernRed)" stroke="#991b1b" stroke-width="1.5" transform="rotate(8 0 0)"/>
    <!-- White V-Collar -->
    <polygon points="-12,-35 0,-20 12,-35" fill="#ffffff" transform="rotate(8 0 0)"/>
    <!-- Sponsor T -->
    <path d="M -8 -8 L 8 -8 M 0 -8 L 0 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" transform="rotate(8 0 0)"/>
    <!-- Bayern Crest -->
    <use href="#bayernCrest" x="-14" y="-18" transform="rotate(8 0 0)"/>

    <!-- Left Arm (extended forward for balance) -->
    <path d="M -24 -20 L -55 -28 L -68 -15" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -24 -20 L -38 -24" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>

    <!-- Right Arm (cocked back) -->
    <path d="M 28 -20 L 52 -10 L 62 10" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 28 -20 L 40 -15" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <g transform="translate(6, 0)">
      <circle cx="0" cy="-60" r="28" fill="url(#skin)"/>
      <path d="M -28 -66 C -28 -95 28 -95 28 -66 C 18 -66 12 -74 -4 -74 C -18 -74 -22 -66 -28 -66 Z" fill="url(#hairGrad)"/>
      <ellipse cx="10" cy="-58" rx="4" ry="5" fill="#0f172a"/>
      <path d="M 6 -46 Q 12 -42 16 -46" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -26 -68 C -10 -76 10 -76 26 -68" fill="none" stroke="#ffffff" stroke-width="4.5"/>
    </g>
  </g>

  <!-- ==============================================================
       FRAME 2 (600 to 900): Mid-Air Power Strike / Volley!
       ============================================================== -->
  <g id="frame-2" transform="translate(750, 110)">
    <!-- Shadow (airborne, smaller and offset) -->
    <ellipse cx="0" cy="145" rx="28" ry="7" fill="rgba(0, 0, 0, 0.18)"/>

    <!-- Left Leg (tucked underneath) -->
    <path d="M -16 40 L -38 68 L -24 95" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="-30" y="92" width="20" height="10" rx="3" fill="#1e293b"/>

    <!-- Right Leg (explosive kick swinging high through ball!) -->
    <path d="M 10 35 L 55 25 L 95 10" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="92" y="4" width="22" height="12" rx="3" fill="#1e293b" transform="rotate(-15 95 10)"/>

    <!-- Kick Motion Trail / Speed Arc -->
    <path d="M 20 65 Q 85 55 110 5" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- Shorts (airborne flare) -->
    <rect x="-26" y="22" width="52" height="30" rx="6" fill="#ffffff" stroke="#dc052d" stroke-width="2"/>

    <!-- Torso (tilted backward dynamically) -->
    <rect x="-26" y="-35" width="52" height="65" rx="10" fill="url(#bayernRed)" stroke="#991b1b" stroke-width="1.5" transform="rotate(-18 0 0)"/>
    <polygon points="-12,-35 0,-20 12,-35" fill="#ffffff" transform="rotate(-18 0 0)"/>
    <!-- Sponsor T -->
    <path d="M -8 -8 L 8 -8 M 0 -8 L 0 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" transform="rotate(-18 0 0)"/>
    <use href="#bayernCrest" x="-14" y="-18" transform="rotate(-18 0 0)"/>

    <!-- Left Arm (flung back for balance) -->
    <path d="M -26 -15 L -62 -5 L -80 -25" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -26 -15 L -46 -10" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>

    <!-- Right Arm (pumping forward) -->
    <path d="M 26 -20 L 58 -35 L 75 -20" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 26 -20 L 44 -28" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <g transform="translate(-10, -5)">
      <circle cx="0" cy="-60" r="28" fill="url(#skin)"/>
      <path d="M -28 -66 C -28 -95 28 -95 28 -66 C 18 -66 12 -74 -4 -74 C -18 -74 -22 -66 -28 -66 Z" fill="url(#hairGrad)"/>
      <ellipse cx="10" cy="-58" rx="4" ry="5" fill="#0f172a"/>
      <!-- Determined open mouth shouting "HA!" -->
      <path d="M 4 -48 Q 12 -40 18 -48 Z" fill="#7f1d1d"/>
      <path d="M -26 -68 C -10 -76 10 -76 26 -68" fill="none" stroke="#ffffff" stroke-width="4.5"/>
    </g>
  </g>

  <!-- ==============================================================
       FRAME 3 (900 to 1200): Goal Celebration Landing! ("TOR! / YES!")
       ============================================================== -->
  <g id="frame-3" transform="translate(1050, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="115" rx="45" ry="10" fill="rgba(0, 0, 0, 0.25)"/>

    <!-- Both Legs firmly planted in victory stance -->
    <path d="M -15 40 L -25 75 L -28 110" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="-38" y="108" width="22" height="10" rx="3" fill="#1e293b"/>

    <path d="M 15 40 L 25 75 L 28 110" fill="none" stroke="url(#bayernRed)" stroke-width="14" stroke-linecap="round"/>
    <rect x="18" y="108" width="22" height="10" rx="3" fill="#1e293b"/>

    <!-- Shorts -->
    <rect x="-26" y="25" width="52" height="30" rx="6" fill="#ffffff" stroke="#dc052d" stroke-width="2"/>
    <line x1="-26" y1="40" x2="-26" y2="52" stroke="#dc052d" stroke-width="3"/>
    <line x1="26" y1="40" x2="26" y2="52" stroke="#dc052d" stroke-width="3"/>

    <!-- Torso straight up with chest puffed out -->
    <rect x="-26" y="-35" width="52" height="65" rx="10" fill="url(#bayernRed)" stroke="#991b1b" stroke-width="1.5"/>
    <polygon points="-12,-35 0,-20 12,-35" fill="#ffffff"/>
    <path d="M -8 -8 L 8 -8 M 0 -8 L 0 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <use href="#bayernCrest" x="-14" y="-18"/>

    <!-- Both Arms Raised in Victory! -->
    <!-- Left Arm -->
    <path d="M -26 -25 L -52 -55 L -45 -85" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -26 -25 L -42 -42" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-45" cy="-85" r="7" fill="url(#skin)"/> <!-- Fist -->

    <!-- Right Arm -->
    <path d="M 26 -25 L 52 -55 L 45 -85" fill="none" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 26 -25 L 42 -42" fill="none" stroke="url(#bayernRed)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="45" cy="-85" r="7" fill="url(#skin)"/> <!-- Fist -->

    <!-- Head looking up joyfully -->
    <circle cx="0" cy="-60" r="28" fill="url(#skin)"/>
    <path d="M -28 -66 C -28 -95 28 -95 28 -66 C 18 -66 12 -74 -4 -74 C -18 -74 -22 -66 -28 -66 Z" fill="url(#hairGrad)"/>
    <!-- Joyful Eyes and Big Cheering Smile -->
    <path d="M -8 -60 Q -4 -65 0 -60" fill="none" stroke="#0f172a" stroke-width="3"/>
    <path d="M 4 -60 Q 8 -65 12 -60" fill="none" stroke="#0f172a" stroke-width="3"/>
    <path d="M -8 -48 Q 2 -36 12 -48 Z" fill="#dc052d" stroke="#78350f" stroke-width="1.5"/>
    <path d="M -26 -68 C -10 -76 10 -76 26 -68" fill="none" stroke="#ffffff" stroke-width="4.5"/>
  </g>
</svg>
