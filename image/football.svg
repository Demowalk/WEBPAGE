<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <defs>
    <!-- 3D Sphere Shading -->
    <radialGradient id="ballShade" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    
    <!-- Motion Glow -->
    <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ballGlow)">
    <!-- Main Ball Sphere -->
    <circle cx="35" cy="35" r="32" fill="url(#ballShade)" stroke="#334155" stroke-width="1.5"/>

    <!-- Center Black Pentagon -->
    <polygon points="35,22 46,30 42,42 28,42 24,30" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Surrounding Hexagon Seams -->
    <line x1="35" y1="22" x2="35" y2="7" stroke="#334155" stroke-width="1.5"/>
    <line x1="46" y1="30" x2="58" y2="24" stroke="#334155" stroke-width="1.5"/>
    <line x1="42" y1="42" x2="55" y2="52" stroke="#334155" stroke-width="1.5"/>
    <line x1="28" y1="42" x2="15" y2="52" stroke="#334155" stroke-width="1.5"/>
    <line x1="24" y1="30" x2="12" y2="24" stroke="#334155" stroke-width="1.5"/>

    <!-- Perimeter Black Patches -->
    <!-- Top Patch -->
    <polygon points="28,5 42,5 35,12" fill="#1e293b"/>
    <!-- Top-Right Patch -->
    <polygon points="62,18 67,28 58,24" fill="#1e293b"/>
    <!-- Bottom-Right Patch -->
    <polygon points="62,48 55,56 50,48" fill="#1e293b"/>
    <!-- Bottom-Left Patch -->
    <polygon points="8,48 15,56 20,48" fill="#1e293b"/>
    <!-- Top-Left Patch -->
    <polygon points="8,18 3,28 12,24" fill="#1e293b"/>

    <!-- Bayern Red Mini Star / Accent -->
    <circle cx="35" cy="32" r="3.5" fill="#dc052d"/>

    <!-- Specular Highlight -->
    <ellipse cx="27" cy="21" rx="8" ry="5" fill="#ffffff" opacity="0.65" transform="rotate(-30 27 21)"/>
  </g>
</svg>
